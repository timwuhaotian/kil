<?xml version="1.0" encoding="UTF-8"?>
<!-- Kil app icon: the terminal tile from killi's logo (../killi/docs/icon.svg), taken whole —
     same colors, -5° tilt and proportions — centred alone on the macOS 1024 grid (824 body).
     The inner group is killi's, verbatim; the outer transform only centres and scales it.
     Render: rsvg-convert -w 1254 -h 1254 packaging/icon.svg -o packaging/app-icon.png -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <g transform="translate(512 512) scale(2.6813) translate(-259 -303.8)">
    <g transform="rotate(-5 256 292)">
      <rect x="120" y="176" width="276" height="276" rx="72" fill="#6FA8DC"/>
      <rect x="120" y="156" width="276" height="276" rx="72" fill="#CFE2F3"/>
      <rect x="154" y="190" width="70" height="23" rx="11.5" fill="#FFFFFF" transform="rotate(-28 189 201)"/>
      <circle cx="244" cy="194" r="9" fill="#FFFFFF"/>
      <ellipse cx="340" cy="284" rx="21" ry="14" fill="#F4CCCC"/>
      <path d="M 184 256 L 242 296 L 184 336" fill="none" stroke="#223853" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 278 336 L 338 336" fill="none" stroke="#223853" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
